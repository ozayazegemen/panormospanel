[build]
  # Yalnızca bu klasörde (panormos-v2) değişiklik varsa derle; öbür projelerin değişikliği yayın kredisi harcamasın
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Müşteriye gönderilen fatura bağlantısı (genel kuraldan önce gelmeli)
[[redirects]]
  from = "/f/*"
  to = "/.netlify/functions/fatura/:splat"
  status = 200

# Edin Peynir taslağı artık kendi adresinde; eski bağlantıyı açan oraya gider
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/edin/*"
  to = "https://edinlergida.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/edin"
  to = "https://edinlergida.com.tr/"
  status = 301
  force = true

# Hazır (Google'a dönük) sayfalar: /qr-menu ve /qr-menu/ ikisi de yönlendirmesiz aynı sayfayı verir.
# 20.10.2026'daki bir ara sürüm bazı tarayıcılara "/qr-menu → /qr-menu/" yönlendirmesini kalıcı kaydettirdi;
# Netlify'ın sondaki eğik çizgiyi kaldırmasıyla döngü olmasın diye bu adresler doğrudan dosyaya bağlanır.
[[redirects]]
  from = "/qr-menu/"
  to = "/qr-menu/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/blog/"
  to = "/blog/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# QR Menü abonelik hatırlatması ve süresi geçen menüleri kapatma: her sabah 09:00 (Türkiye saati)
[functions."qr-abonelik-hatirlat"]
  schedule = "0 6 * * *"

# Her gece 02:00'de (Türkiye saati) otomatik tam yedek
[functions."nightly-backup"]
  schedule = "0 23 * * *"

# Paylaşım Planlayıcı: zamanı gelen Instagram paylaşımlarını her 5 dakikada gönderir
[functions."planlayici-zamanli"]
  schedule = "*/5 * * * *"

# Instagram takipçi arşivi: her gece 23:30 (Türkiye) bağlı müşterilerin takipçi sayısı ve günlük hareket
[functions."takipci-gunluk"]
  schedule = "30 20 * * *"
