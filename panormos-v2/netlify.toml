[build]
  # Yalnızca bu klasörde (panormos-v2) değişiklik varsa derle; öbür projelerin değişikliği yayın kredisi harcamasın
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Müşteriye gönderilen fatura bağlantısı (genel kuraldan önce gelmeli)
[[redirects]]
  from = "/f/*"
  to = "/.netlify/functions/fatura/:splat"
  status = 200

# Edin Peynir taslağı artık kendi adresinde; eski bağlantıyı açan oraya gider
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/edin/*"
  to = "https://edinlergida.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/edin"
  to = "https://edinlergida.com.tr/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Her gece 02:00'de (Türkiye saati) otomatik tam yedek
[functions."nightly-backup"]
  schedule = "0 23 * * *"
