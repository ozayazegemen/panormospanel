# Edinler Gıda sitesi: ayrı Netlify sitesi olarak yayınlanır (temel klasör: edin-site). Derleme yok, dosyalar olduğu gibi sunulur.
[build]
  # Yalnızca bu klasörde (edin-site) değişiklik varsa derle; öbür projelerin değişikliği yayın kredisi harcamasın
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
  publish = "."
  command = ""
# Formlar: Netlify Forms (teklif, gorus) — form algılama 13.10.2026'da açıldı

# Tarayıcılar ve Google sekme ikonunu önce /favicon.ico adresinde arar
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon-48.png"
  status = 200

# Eski Netlify adresi ve www, tek asıl adrese (Google aynı sayfayı iki kez saymasın)
[[redirects]]
  from = "https://edin-peynir.netlify.app/*"
  to = "https://edinlergida.com.tr/:splat"
  status = 301
  force = true
